<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Balloon Room</title>
  <meta name="description" content="A personal, self-paced ICPC preparation tracker.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F7F2E4">
  <script>
    // Apply the saved theme and sidebar state before the first paint, so nothing flickers.
    (function () {
      var theme = 'system';
      var sidebar = 'expanded';
      try {
        var saved = JSON.parse(localStorage.getItem('balloonroom:v1'));
        if (saved && saved.prefs) {
          theme = saved.prefs.theme || theme;
          sidebar = saved.prefs.sidebar || sidebar;
        }
      } catch (e) { /* unreadable or blocked storage: use the defaults */ }
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.setAttribute('data-sidebar', sidebar === 'collapsed' ? 'collapsed' : 'expanded');
    })();
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 58'%3E%3Cpath d='M20 38 C11 33 4 26 4 17 C4 8.2 11.2 2 20 2 C28.8 2 36 8.2 36 17 C36 26 29 33 20 38 Z' fill='%23D4AF37' stroke='%235A6B2E' stroke-width='3'/%3E%3Cpath d='M20 41 C17 46 23 51 20 57' fill='none' stroke='%235A6B2E' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500&family=Source+Sans+3:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./src/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app">
    <header class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <a class="brand" href="#/home">Balloon Room</a>
        <button type="button" class="icon-btn collapse-btn" id="sidebar-toggle" title="Collapse sidebar">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14.5 6 L8.5 12 L14.5 18"/><path d="M4 4 V20"/></svg>
          <span class="sr-only" id="sidebar-toggle-label">Collapse sidebar</span>
        </button>
      </div>
      <p class="brand-sub">ICPC preparation at your own pace</p>
      <nav class="nav" aria-label="Main">
        <ul>
          <li><a href="#/home" data-route="home">
            <svg class="icon nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 10.5 L12 4 L20 10.5 V19.5 A0.5 0.5 0 0 1 19.5 20 H14.5 V14 H9.5 V20 H4.5 A0.5 0.5 0 0 1 4 19.5 Z"/></svg>
            <span class="nav-label">Home</span></a></li>
          <li><a href="#/plan" data-route="plan">
            <svg class="icon nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 5 L3.5 7 V19.5 L9 17.5 L15 19.5 L20.5 17.5 V5 L15 7 Z"/><path d="M9 5 V17.5"/><path d="M15 7 V19.5"/></svg>
            <span class="nav-label">Plan</span></a></li>
          <li><a href="#/topics" data-route="topics">
            <svg class="icon nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 6.5 C10 5 7 4.5 4 5 V18.5 C7 18 10 18.5 12 20 C14 18.5 17 18 20 18.5 V5 C17 4.5 14 5 12 6.5 Z"/><path d="M12 6.5 V20"/></svg>
            <span class="nav-label">Topics</span></a></li>
          <li><a href="#/problems" data-route="problems">
            <svg class="icon nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 4.5 H15 V7 H9 Z"/><path d="M9 5.5 H6 V20.5 H18 V5.5 H15"/><path d="M9 11 H15"/><path d="M9 15 H13"/></svg>
            <span class="nav-label">Problem log</span></a></li>
        </ul>
      </nav>
      <div class="sidebar-foot">
        <button type="button" class="theme-btn" id="theme-toggle" aria-pressed="false">
          <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19.5 14.5 A7.5 7.5 0 1 1 9.5 4.5 A6 6 0 0 0 19.5 14.5 Z"/></svg>
          <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2.5 V5 M12 19 V21.5 M2.5 12 H5 M19 12 H21.5 M5.3 5.3 L7 7 M17 17 L18.7 18.7 M5.3 18.7 L7 17 M17 7 L18.7 5.3"/></svg>
          <span class="theme-label">Dark mode</span>
        </button>
        <p class="sidebar-note">Saved in this browser only.</p>
      </div>
    </header>
    <main id="main" class="main" tabindex="-1">
      <div id="notices" class="notices"></div>
      <div id="view" class="view">
        <noscript><p>Balloon Room needs JavaScript to run.</p></noscript>
      </div>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
